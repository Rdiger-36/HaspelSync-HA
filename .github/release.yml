# Groups the notes that gh release create --generate-notes writes, see
# .github/workflows/release.yml. A pull request lands in the first category
# whose labels it carries, so the catch all has to stay last.
changelog:
  exclude:
    labels:
      - ignore-for-release

  categories:
    # First, because a breaking change is nearly always a feature or a fix as
    # well and carries both labels. Listed under New Features it would read like
    # something to look forward to.
    - title: Breaking Changes
      labels:
        - breaking

    - title: New Features
      labels:
        - enhancement

    - title: Fixes
      labels:
        - bug

    - title: Deprecations
      labels:
        - deprecation

    - title: Documentation
      labels:
        - documentation

    - title: Maintenance
      labels:
        - maintenance

    # Everything without one of the labels above, so an unlabelled pull request
    # is still listed rather than silently missing from the release notes.
    - title: Other Changes
      labels:
        - "*"
